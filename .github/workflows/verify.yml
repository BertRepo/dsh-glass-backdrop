name: Verify package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: npm run check
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-glass-backdrop-${{ matrix.os }}
          path: dsh-glass-backdrop-*.tgz
